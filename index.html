<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chef Sean's Table · 私厨菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFFAF5 100%);
            color: #3D2914;
            min-height: 100vh;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
            padding: 24px 20px 20px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.25);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
            font-weight: 400;
        }

        .container {
            padding: 16px 16px 80px;
            max-width: 480px;
            margin: 0 auto;
        }

        .category {
            background: white;
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        .category:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .category-header {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFF4E8 100%);
            transition: all 0.3s ease;
        }

        .category-header:hover {
            background: linear-gradient(135deg, #FFF4E8 0%, #FFECD5 100%);
        }

        .category-header.active {
            background: linear-gradient(135deg, #FFF4E8 0%, #FFECD5 100%);
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .category-emoji {
            font-size: 28px;
            line-height: 1;
        }

        .category-name {
            font-size: 17px;
            font-weight: 600;
            color: #C2410C;
            letter-spacing: 0.5px;
        }

        .category-icon {
            transition: transform 0.3s ease;
            color: #F97316;
            font-size: 20px;
        }

        .category-header.active .category-icon {
            transform: rotate(180deg);
        }

        .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-content.open {
            max-height: 2000px;
        }

        .dish-list {
            padding: 4px 0;
        }

        .dish-item {
            padding: 14px 20px;
            border-top: 1px solid #FFF0E0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            transition: background 0.2s ease;
        }

        .dish-item:first-child {
            border-top: none;
        }

        .dish-item:hover {
            background: #FFF8F0;
        }

        .dish-info {
            flex: 1;
        }

        .dish-name {
            font-size: 16px;
            font-weight: 500;
            color: #3D2914;
            margin-bottom: 4px;
        }

        .dish-desc {
            font-size: 13px;
            color: #8B6F47;
            line-height: 1.5;
        }

        .dish-tag {
            background: #FEF3C7;
            color: #B45309;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            padding: 24px 20px;
            color: #A8896C;
            font-size: 12px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dish-item {
            animation: fadeInUp 0.3s ease forwards;
        }

        .dish-item:nth-child(1) { animation-delay: 0.05s; }
        .dish-item:nth-child(2) { animation-delay: 0.1s; }
        .dish-item:nth-child(3) { animation-delay: 0.15s; }
        .dish-item:nth-child(4) { animation-delay: 0.2s; }
        .dish-item:nth-child(5) { animation-delay: 0.25s; }
        .dish-item:nth-child(6) { animation-delay: 0.3s; }
        .dish-item:nth-child(7) { animation-delay: 0.35s; }
        .dish-item:nth-child(8) { animation-delay: 0.4s; }
        .dish-item:nth-child(9) { animation-delay: 0.45s; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Chef Sean's Table</h1>
        <p>私厨 · 用心做每一道菜</p>
    </div>

    <div class="container" id="menu-container"></div>

        <p>👨‍🍳 Chef Sean · 用心呈现</p>

                    { name: "盐水小白虾", desc: "江南清鲜" }

                    { name: "小白菜熬洋芋", desc: "朴实治愈" },

            },
            {
                emoji: "🥣",
                name: "𝖲𝖮𝖴𝖯𝖲 · 润喉暖胃汤羹",
                dishes: [
                    { name: "皮蛋肉饼汤", desc: "瓦罐灵魂，地道街头味" },
                    { name: "滑肉汤", desc: "细腻滑嫩" },

                    { name: "番茄肉丸汤", desc: "酸甜开胃" }
                ]
            },
            {
                emoji: "🍜",
                name: "𝖲𝖳𝖠𝖯𝖫𝖤𝖲 · 地方主食/灵魂碳水",
                dishes: [
                    { name: "铅山烫粉", desc: "江西上饶非遗风味" },
                    { name: "铅山炒粉", desc: "镬气十足，米粉一绝" },
                    { name: "灯盏粿", desc: "极为少见的地道手作小吃" },
                    { name: "潮汕鱼粥", desc: "深夜治愈系" },
                    { name: "黄鱼炒饭", desc: "高端鲜美" },
                    { name: "带鱼炒饭", desc: "风味独特" },
                    { name: "咸肉菜饭", desc: "干香有嚼劲" },
                    { name: "卤肉饭", desc: "胶质满满" },
                    { name: "免治牛肉饭", desc: "港澳茶餐厅经典" }
                ]
            }
        ];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            
            menuData.forEach((category, index) => {
                const categoryEl = document.createElement('div');
                categoryEl.className = 'category';
                
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    <div class="category-title">
                        <span class="category-emoji">${category.emoji}</span>
                        <span class="category-name">${category.name}</span>
                    </div>
                    <span class="category-icon">▼</span>
                `;
                
                const content = document.createElement('div');
                content.className = 'category-content';
                
                const dishList = document.createElement('div');
                dishList.className = 'dish-list';
                
                category.dishes.forEach(dish => {
                    const dishItem = document.createElement('div');
                    dishItem.className = 'dish-item';
                    dishItem.innerHTML = `
                        <div class="dish-info">
                            <div class="dish-name">${dish.name}</div>
                            ${dish.desc ? `<div class="dish-desc">${dish.desc}</div>` : ''}
                        </div>
                    `;
                    dishList.appendChild(dishItem);
                });
                
                content.appendChild(dishList);
                categoryEl.appendChild(header);
                categoryEl.appendChild(content);
                
                if (index === 0) {
                    header.classList.add('active');
                    content.classList.add('open');
                }
                
                header.addEventListener('click', () => {
                    const isOpen = content.classList.contains('open');
                    header.classList.toggle('active', !isOpen);
                    content.classList.toggle('open', !isOpen);
                });
                
                container.appendChild(categoryEl);
            });
        }

        document.addEventListener('DOMContentLoaded', renderMenu);
    </script>
</body>
</html>
